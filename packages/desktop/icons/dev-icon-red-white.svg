<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Red and White Dev Icon</title>
  <desc id="desc">A red and white SVG reinterpretation of the dev app icon with rounded square blueprint grid background and white OpenCode-style mark.</desc>
  <defs>
    <linearGradient id="red-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a5f"/>
      <stop offset="0.48" stop-color="#f0182f"/>
      <stop offset="1" stop-color="#a90016"/>
    </linearGradient>
    <linearGradient id="red-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b70"/>
      <stop offset="1" stop-color="#c7001d"/>
    </linearGradient>
    <linearGradient id="white-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="outer-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset in="blur" dx="0" dy="12" result="offset"/>
      <feFlood flood-color="#58000a" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="0" dy="10" result="offset"/>
      <feFlood flood-color="#3d0007" flood-opacity="0.42" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="inner-hole-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dx="0" dy="4" result="offset"/>
      <feFlood flood-color="#420007" flood-opacity="0.45" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="rounded-square">
      <rect x="4" y="4" width="504" height="504" rx="92"/>
    </clipPath>
  </defs>

  <rect x="4" y="4" width="504" height="504" rx="92" fill="url(#red-bg)"/>
  <g clip-path="url(#rounded-square)">
    <path d="M0 160h512M0 256h512M0 352h512M160 0v512M256 0v512M352 0v512" stroke="#ffffff" stroke-width="2.5" opacity="0.34"/>
    <path d="M36 36h440v440H36z" fill="none" stroke="#ffffff" stroke-width="2.2" opacity="0.42"/>
    <path d="M36 36l440 440M476 36L36 476" stroke="#ffffff" stroke-width="1.9" opacity="0.28"/>
    <circle cx="256" cy="256" r="220" fill="none" stroke="#ffffff" stroke-width="2.1" opacity="0.34"/>
    <circle cx="256" cy="256" r="132" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.18"/>
    <rect x="4" y="4" width="504" height="504" rx="92" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.16"/>
    <path d="M8 426c108 28 389 25 496-5v88H8z" fill="#70000f" opacity="0.18"/>
    <path d="M0 0h512v86H0z" fill="#ffffff" opacity="0.08"/>
  </g>

  <rect x="4" y="4" width="504" height="504" rx="92" fill="none" stroke="#7a0010" stroke-width="8" opacity="0.45" filter="url(#outer-shadow)"/>

  <g filter="url(#card-shadow)">
    <rect x="116" y="82" width="280" height="348" rx="24" fill="url(#white-face)"/>
    <rect x="116" y="82" width="280" height="348" rx="24" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.82"/>
    <rect x="116" y="82" width="280" height="348" rx="24" fill="none" stroke="#a90016" stroke-width="2" opacity="0.22"/>
  </g>

  <g filter="url(#inner-hole-shadow)">
    <rect x="184" y="146" width="144" height="214" rx="18" fill="#ffffff"/>
    <rect x="192" y="154" width="128" height="198" rx="12" fill="url(#red-inner)"/>
    <path d="M192 214h128M192 282h128M256 154v198M192 154l128 198M320 154L192 352" stroke="#ffffff" stroke-width="1.8" opacity="0.28"/>
    <rect x="192" y="154" width="128" height="198" rx="12" fill="none" stroke="#850012" stroke-width="5" opacity="0.58"/>
    <path d="M204 154h104q12 0 12 12v6H192v-6q0-12 12-12z" fill="#ffffff" opacity="0.16"/>
    <path d="M192 332h128v8q0 12-12 12H204q-12 0-12-12z" fill="#62000c" opacity="0.18"/>
  </g>

  <path d="M4 94C4 44.3 44.3 4 94 4h324c49.7 0 90 40.3 90 90v8C508 52.7 467.3 12 418 12H94C44.7 12 4 52.7 4 102z" fill="#ffffff" opacity="0.18"/>
</svg>
