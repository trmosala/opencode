<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="-5 -6 32 34" role="img" aria-labelledby="title">
  <title id="title">Loading</title>
  <style>
    .cookie { transform-origin:11px 18px; animation:bounce 2.4s ease-in-out infinite; }
    .chip { animation:chip 1.8s ease-in-out infinite; }
    .shadow { transform-origin:11px 25px; animation:shadow 2.4s ease-in-out infinite; }
    @keyframes bounce {
      0%,100% { transform:translateY(0) rotate(-6deg); }
      25% { transform:translateY(-2px) rotate(4deg); }
      50% { transform:translateY(0) rotate(6deg) scale(1.04,.96); }
      75% { transform:translateY(-2px) rotate(-4deg); }
    }
    @keyframes chip {
      0%,60%,100% { transform:scale(1) rotate(0deg); opacity:1; }
      25% { transform:scale(.55) rotate(90deg); opacity:.35; }
      42% { transform:scale(1.15) rotate(90deg); opacity:1; }
    }
    @keyframes shadow {
      0%,50%,100% { transform:scaleX(1); opacity:.18; }
      25%,75% { transform:scaleX(.65); opacity:.08; }
    }
    @media (prefers-reduced-motion:reduce) {
      .cookie,.chip,.shadow { animation:none; }
    }
  </style>
