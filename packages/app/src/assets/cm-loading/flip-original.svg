<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="-6 -6 34 34" role="img" aria-labelledby="title">
  <title id="title">Loading</title>
  <style>.cookie {transform-origin:11px 11px; animation:flip 2.4s ease-in-out infinite;}
@keyframes flip {
  0%,100% {transform:translateY(0) scaleX(1) rotate(-8deg)}
  25% {transform:translateY(-3px) scaleX(.05) rotate(0deg)}
  50% {transform:translateY(0) scaleX(-1) rotate(8deg)}
  75% {transform:translateY(-3px) scaleX(-.05) rotate(0deg)}
}
  @media (prefers-reduced-motion:reduce) { .cookie,.bite,.piece,.rim { animation:none !important; } }
  </style>

