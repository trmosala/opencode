name: cookiemonster-windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing CookieMonster release tag"
        required: true
        default: "cookiemonster-v1.18.34_14"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    # The C++17 Windows Hello helpers use the VS 2022 C++/WinRT toolchain.
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      OPENCODE_CHANNEL: prod
      CM_BRAND: "1"
      CM_UNSIGNED: "1"
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag }}

      - name: Resolve release version
        run: |
          $package = Get-Content packages/desktop/package.json | ConvertFrom-Json
          if ($env:RELEASE_TAG -notmatch '^cookiemonster-v([0-9]+\.[0-9]+\.[0-9]+)_([0-9]{2})$') {
            throw 'Invalid CookieMonster release tag'
          }
          if ($Matches[1] -ne $package.version) { throw 'Release tag does not match desktop version' }
          $version = "$($package.version)-cm.$([int]$Matches[2])"
          "CM_VERSION=$version" >> $env:GITHUB_ENV
          "OPENCODE_VERSION=$version" >> $env:GITHUB_ENV
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup Bun and dependencies
        uses: ./.github/actions/setup-bun

      - name: Test Windows packaging
        working-directory: packages/desktop
        env:
          CM_BRAND: "0"
          CM_UNSIGNED: "0"
          OPENCODE_CHANNEL: dev
        # The packaging config stages the AE adapter built by cm-v2.
        run: |
          bun run --cwd ../cm-v2 build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test --timeout 20000 electron-builder.config.test.ts src/main/system-cli.test.ts

      - name: Build CookieMonster
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run build

      - name: Package Windows x64 installer
        working-directory: packages/desktop
        run: bun run package:win --x64 --publish never

      - name: Verify packaged version and startup
        working-directory: packages/desktop
        run: |
          @'
          const { createRequire } = require('node:module')
          const builder = createRequire(require.resolve('electron-builder'))
          const packaging = createRequire(builder.resolve('app-builder-lib'))
          const asar = packaging('@electron/asar')
          const fs = require('node:fs')
          const path = require('node:path')
          const assert = require('node:assert/strict')
          const resources = 'dist/win-unpacked/resources'
          assert.equal(JSON.parse(asar.extractFile(resources+'/app.asar', 'package.json')).version, process.env.CM_VERSION)
          assert(asar.extractFile(resources+'/app.asar', path.join('out', 'main', 'index.js')).toString().includes('protocol === "blob:"'))
          for (const file of ['opencode-cli.exe', 'cli/opencode.exe', 'cm-browser/dist/plugin-v2.mjs', 'vault-auth/windows-x64.exe', 'vault-auth/windows-entry-x64.exe']) assert(fs.existsSync(resources+'/'+file), file)
          '@ | node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./dist/win-unpacked/resources/opencode-cli.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun scripts/startup-smoke.ts dist/win-unpacked/resources/app.asar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows release assets
        working-directory: packages/desktop
        run: |
          $files = @(Get-Item dist/cookiemonster-win-x64.exe, dist/cookiemonster-win-x64.exe.blockmap, dist/latest.yml)
          gh release upload $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY @($files.FullName)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Windows x64 installer uploaded to $env:RELEASE_TAG (unsigned)." >> $env:GITHUB_STEP_SUMMARY
