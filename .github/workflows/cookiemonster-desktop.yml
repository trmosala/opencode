name: cookiemonster-desktop

# Builds signed and notarized CookieMonster macOS DMG/zip artifacts. Uploads the validated DMG plus the
# auto-update files (zip, zip blockmap and latest-mac.yml) that installed apps read from the Latest release.
#
# macOS is the sole supported CookieMonster target. Signing uses the Developer ID certificate and App
# Store Connect API key in the APPLE_* secrets (APPLE_API_KEY holds the key ID, APPLE_API_KEY_PATH the
# .p8 contents). CM_UNSIGNED=1 in packages/desktop/electron-builder.config.ts stays available for
# local builds without credentials.
#
# Runs on manual dispatch only. Artifacts expire after 7 days to stay inside the 500 MB cap.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish installers after native validation"
        required: true
        default: false
        type: boolean
      revision:
        description: "Two-digit CookieMonster release revision"
        required: true
        default: "01"
        type: string

# Never cancel a run that may be uploading release assets.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: package (macos)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # CookieMonster is branded independently, so prod behavior is safe while CM_BRAND keeps its
      # identity, bundled CLI sidecar, and disabled upstream publishing.
      OPENCODE_CHANNEL: prod
      CM_BRAND: "1"
      CM_UNSIGNED: "0"
    steps:
      - name: Refuse to publish from a non-default branch
        # Checked again in the release job; failing here avoids a full signed build that cannot ship.
        if: inputs.publish && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "Publish only from the default branch (dispatched from $GITHUB_REF)." >&2
          exit 1

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Resolve release version
        # Each _NN revision needs its own semver (<base>-cm.<N>), or electron-updater treats it as installed.
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          if [[ ! "$REVISION" =~ ^[0-9]{2}$ ]]; then
            echo "Revision must contain exactly two digits." >&2
            exit 1
          fi
          version=$(node -p "require('./packages/desktop/package.json').version")
          echo "CM_VERSION=${version}-cm.$((10#$REVISION))" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build renderer and main
        # Also runs scripts/prebuild.ts, which copies icons, builds the OpenCode node sidecar and the
        # cm-browser plugin bundle, then downloads the CLI into resources/.
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Test installer configuration and capabilities
        run: bun test --timeout 20000 electron-builder.config.test.ts src/main/macos-user-install.test.ts src/main/system-cli.test.ts
        working-directory: packages/desktop
        # The tests opt into each branding/signing variant themselves.
        env:
          CM_BRAND: "0"
          CM_UNSIGNED: "0"
          OPENCODE_CHANNEL: dev

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93 # v2.0.0
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Setup notarization key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          test -n "$APPLE_API_KEY_CONTENT"
          umask 077
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/apple-api-key.p8"

      - name: Package, sign and notarize installer
        # forceCodeSigning fails the build instead of silently emitting an unsigned app.
        run: npx electron-builder --mac --publish never --config electron-builder.config.ts -c.forceCodeSigning=true
        working-directory: packages/desktop
        env:
          CSC_KEYCHAIN: build.keychain
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Notarize and staple the DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for dmg in packages/desktop/dist/cookiemonster-mac-*.dmg; do
            xcrun notarytool submit "$dmg" --key "$RUNNER_TEMP/apple-api-key.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --timeout 15m
            xcrun stapler staple "$dmg"
          done

      - name: Remove notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/apple-api-key.p8"

      - name: Verify signing and notarization
        run: |
          for app in packages/desktop/dist/mac*/CookieMonster.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          done
          for dmg in packages/desktop/dist/cookiemonster-mac-*.dmg; do
            codesign --verify --strict --verbose=2 "$dmg"
            xcrun stapler validate "$dmg"
          done

      - name: Refresh DMG checksum in latest-mac.yml
        # Stapling rewrites the DMG after electron-builder hashed it. The updater downloads the zip (whose app
        # is already notarized and stapled), but keep the DMG entry truthful and pin the metadata to this revision.
        # The DMG blockmap is stale for the same reason, so it is not published.
        working-directory: packages/desktop/dist
        run: |
          node <<'EOF'
          const fs = require("node:fs")
          const crypto = require("node:crypto")
          const assert = require("node:assert/strict")
          const text = fs.readFileSync("latest-mac.yml", "utf8")
          assert(text.includes(`version: ${process.env.CM_VERSION}\n`), "latest-mac.yml version must match CM_VERSION")
          assert(/^path: cookiemonster-mac-[^\n]+\.zip$/m.test(text), "latest-mac.yml must point at the zip")
          const updated = text.replace(
            /(- url: (cookiemonster-mac-[^\n]+\.dmg)\n\s+sha512: )[^\n]+(\n\s+size: )\d+/g,
            (_, head, name, sizeHead) => {
              const bytes = fs.readFileSync(name)
              return head + crypto.createHash("sha512").update(bytes).digest("base64") + sizeHead + bytes.length
            },
          )
          fs.writeFileSync("latest-mac.yml", updated)
          EOF
          cat latest-mac.yml

      - name: List packaged output
        run: ls -la packages/desktop/dist

      - name: Test non-root DMG app installation and removal
        # Validates copying and the private binary, not Electron startup or WPP authentication.
        run: bun scripts/smoke-macos-dmg.ts
        working-directory: packages/desktop

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cookiemonster-macos
          path: |
            packages/desktop/dist/cookiemonster-mac-*.dmg
            packages/desktop/dist/cookiemonster-mac-*.zip
            packages/desktop/dist/cookiemonster-mac-*.zip.blockmap
            packages/desktop/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: package
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision }}
        run: |
          if [[ ! "$REVISION" =~ ^[0-9]{2}$ ]]; then
            echo "Revision must contain exactly two digits." >&2
            exit 1
          fi
          # Published builds become the Latest release every installed app updates from.
          if [[ "$GITHUB_REF" != "refs/heads/${{ github.event.repository.default_branch }}" ]]; then
            echo "Publish only from the default branch (dispatched from $GITHUB_REF)." >&2
            exit 1
          fi
          version=$(node -p "require('./packages/desktop/package.json').version")
          tag="cookiemonster-v${version}_${REVISION}"
          # Re-running the same commit may retry an upload; a different commit needs a new revision,
          # otherwise installed apps already on this version never receive it.
          # Fail closed: only a definite "no such tag" (404/422) counts as a new release.
          status=$(gh api -i "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>/dev/null | head -1 | awk '{print $2}' || true)
          if [[ "$status" == "200" ]]; then
            existing=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$tag" --jq .sha)
            if [[ "$existing" != "$GITHUB_SHA" ]]; then
              echo "$tag already points at $existing; bump the revision to release $GITHUB_SHA." >&2
              exit 1
            fi
          elif [[ "$status" != "404" && "$status" != "422" ]]; then
            echo "Could not check whether $tag exists (HTTP ${status:-unknown}); refusing to publish." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=CookieMonster v${version}_${REVISION}" >> "$GITHUB_OUTPUT"

      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cookiemonster-*
          path: release-assets
          merge-multiple: true

      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ steps.release.outputs.name }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          shopt -s nullglob
          dmgs=(release-assets/cookiemonster-mac-*.dmg)
          zips=(release-assets/cookiemonster-mac-*.zip)
          if (( ${#dmgs[@]} != 1 || ${#zips[@]} != 1 )) || [[ ! -f "${zips[0]}.blockmap" || ! -f release-assets/latest-mac.yml ]]; then
            echo "Expected one validated DMG, one zip with its blockmap, and latest-mac.yml." >&2
            exit 1
          fi
          # latest-mac.yml and the zip are what installed apps auto-update from.
          files=("${dmgs[0]}" "${zips[0]}" "${zips[0]}.blockmap" release-assets/latest-mac.yml)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_NAME"
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_NAME" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          echo "### [$RELEASE_NAME](${{ github.server_url }}/${{ github.repository }}/releases/tag/$RELEASE_TAG)" >> "$GITHUB_STEP_SUMMARY"
