name: cookiemonster-desktop

# Builds unsigned CookieMonster desktop installers: Windows .exe, macOS .pkg/.dmg, and Fedora .rpm.
#
# Native installers use their respective OS; the RPM is built on Ubuntu and tested in Fedora 44.
# There is no Apple Developer certificate and no Azure Trusted Signing
# account for this fork, so CM_UNSIGNED=1 strips signing and notarization from
# packages/desktop/electron-builder.config.ts. Installing an unsigned build therefore trips
# SmartScreen on Windows and Gatekeeper on macOS.
#
# Runs on manual dispatch only. This repository is private on the GitHub Free plan (~2,000 Actions
# minutes/month) and macOS minutes bill at 10x, so an automatic per-push trigger would exhaust the
# monthly allowance quickly. Artifacts expire after 7 days to stay inside the 500 MB cap.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which installers to build"
        required: true
        default: all
        type: choice
        options:
          - all
          - both
          - windows
          - macos
          - fedora
      revision:
        description: "Two-digit CookieMonster release revision"
        required: true
        default: "01"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The matrix is selected here rather than with a job-level `if` on the build job, because
  # jobs.<job_id>.if cannot read the `matrix` context - only github, needs, vars and inputs - so a
  # per-entry condition there would never exclude anything. jobs.<job_id>.strategy can read
  # `inputs`, so emitting the matrix as JSON from this job keeps one build job and one source of
  # truth. Runs on ubuntu (1x minute multiplier) to keep the selection cost negligible.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select build matrix
        id: select
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          windows='{"name":"windows","host":"windows-latest","platform_flag":"--win","config":"electron-builder.config.ts"}'
          macos='{"name":"macos","host":"macos-latest","platform_flag":"--mac","config":"electron-builder.config.ts"}'
          fedora='{"name":"fedora","host":"ubuntu-latest","platform_flag":"--linux rpm","config":"electron-builder.fedora.config.ts"}'
          case "$PLATFORM" in
            windows) matrix="[$windows]" ;;
            macos)   matrix="[$macos]" ;;
            fedora)  matrix="[$fedora]" ;;
            both)    matrix="[$windows,$macos]" ;;
            all)     matrix="[$windows,$macos,$fedora]" ;;
            *)       echo "Unsupported platform: $PLATFORM" >&2; exit 1 ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  package:
    name: package (${{ matrix.settings.name }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        settings: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # CookieMonster is branded independently, so prod behavior is safe while CM_BRAND keeps its
      # identity, bundled CLI sidecar, and disabled upstream publishing.
      OPENCODE_CHANNEL: prod
      CM_BRAND: "1"
      CM_UNSIGNED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install RPM tooling
        if: matrix.settings.name == 'fedora'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - name: Build renderer and main
        # Also runs scripts/prebuild.ts, which copies icons, builds the OpenCode node sidecar and the
        # cm-browser plugin bundle, then downloads the CLI into resources/.
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Test Windows installer configuration
        if: matrix.settings.name == 'windows'
        run: bun test electron-builder.config.test.ts src/main/system-cli.test.ts
        working-directory: packages/desktop

      - name: Package installer
        run: npx electron-builder ${{ matrix.settings.platform_flag }} --publish never --config ${{ matrix.settings.config }}
        working-directory: packages/desktop

      - name: List packaged output
        run: ls -la packages/desktop/dist

      - name: Test install on Fedora 44
        if: matrix.settings.name == 'fedora'
        run: docker run --rm -v "$PWD/packages/desktop/dist:/dist:ro" fedora:44 sh -c 'dnf install -y /dist/*.rpm && rpm -q cookiemonster'

      - name: Test Windows app and command installation
        if: matrix.settings.name == 'windows'
        shell: pwsh
        run: |
          $before = [Environment]::GetEnvironmentVariable("Path", "User")
          $installer = Get-ChildItem packages/desktop/dist/cookiemonster-*.exe | Select-Object -First 1
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "CookieMonster installer failed: $($install.ExitCode)" }
          $root = Join-Path $env:LOCALAPPDATA "Programs/@opencode-aidesktop"
          $cli = Join-Path $root "resources/cli/opencode.exe"
          if (-not (Test-Path -LiteralPath $cli -PathType Leaf)) { throw "Installed CLI is missing." }
          & $cli --version
          if ($LASTEXITCODE -ne 0) { throw "Installed CLI validation failed." }
          $owned = (Join-Path $root "resources/cli").TrimEnd('\').ToUpperInvariant()
          $registered = [Environment]::GetEnvironmentVariable("Path", "User").Split(';') | Where-Object {
            $_.Trim().Trim('"').TrimEnd('\').ToUpperInvariant() -eq $owned
          }
          if (@($registered).Count -ne 1) { throw "CookieMonster CLI path was not registered exactly once." }
          # The runner inherits its old environment. Validate registry-backed discovery here;
          # Explorer/terminal environment refresh remains a native interactive acceptance check.
          $resolved = pwsh -NoLogo -NoProfile -Command '$user = [Environment]::GetEnvironmentVariable("Path", "User"); $machine = [Environment]::GetEnvironmentVariable("Path", "Machine"); $env:Path = "$machine;$user"; (Get-Command opencode -CommandType Application).Source'
          if ($LASTEXITCODE -ne 0 -or $resolved.Trim().ToUpperInvariant() -ne $cli.ToUpperInvariant()) {
            throw "A fresh PowerShell process did not resolve the CookieMonster CLI."
          }
          $uninstaller = Get-ChildItem -LiteralPath $root -Filter "Uninstall*.exe" | Select-Object -First 1
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "CookieMonster uninstaller failed: $($uninstall.ExitCode)" }
          $after = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($after -ne $before) { throw "CookieMonster uninstall did not restore the original user PATH." }
          $remaining = pwsh -NoLogo -NoProfile -Command '$user = [Environment]::GetEnvironmentVariable("Path", "User"); $machine = [Environment]::GetEnvironmentVariable("Path", "Machine"); $env:Path = "$machine;$user"; @(Get-Command opencode -CommandType Application -All -ErrorAction SilentlyContinue | ForEach-Object Source) -join "`n"'
          if ($remaining -split "`n" | Where-Object { $_.Trim().ToUpperInvariant() -eq $cli.ToUpperInvariant() }) {
            throw "A fresh PowerShell process still resolves the removed CookieMonster CLI."
          }

      - name: Test macOS link ownership
        if: matrix.settings.name == 'macos'
        run: packages/desktop/scripts/test-macos-cli.sh

      - name: Test macOS app and command installation
        if: matrix.settings.name == 'macos'
        run: |
          if [[ -e /usr/local/bin/opencode || -L /usr/local/bin/opencode ]]; then
            echo "/usr/local/bin/opencode already belongs to the runner; refusing to replace it." >&2
            exit 1
          fi
          cleanup() {
            sudo packages/desktop/scripts/uninstall-macos-cli.sh || true
            sudo rm -rf /Applications/CookieMonster.app
          }
          trap cleanup EXIT
          pkg=$(find packages/desktop/dist -maxdepth 1 -name 'cookiemonster-*.pkg' -print -quit)
          sudo installer -pkg "$pkg" -target /
          test -d /Applications/CookieMonster.app
          test "$(readlink /usr/local/bin/opencode)" = "/Applications/CookieMonster.app/Contents/Resources/cli/opencode"
          /usr/local/bin/opencode --version
          sudo installer -pkg "$pkg" -target /
          test "$(readlink /usr/local/bin/opencode)" = "/Applications/CookieMonster.app/Contents/Resources/cli/opencode"
          sudo packages/desktop/scripts/uninstall-macos-cli.sh
          test ! -e /usr/local/bin/opencode
          test ! -L /usr/local/bin/opencode

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cookiemonster-${{ matrix.settings.name }}
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.pkg
            packages/desktop/dist/*.rpm
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve release
        id: release
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          if [[ ! "$REVISION" =~ ^[0-9]{2}$ ]]; then
            echo "Revision must contain exactly two digits." >&2
            exit 1
          fi
          version=$(node -p "require('./packages/desktop/package.json').version")
          tag="cookiemonster-v${version}_${REVISION}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=CookieMonster v${version}_${REVISION}" >> "$GITHUB_OUTPUT"

      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cookiemonster-*
          path: release-assets
          merge-multiple: true

      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ steps.release.outputs.name }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(release-assets/*.exe release-assets/*.dmg release-assets/*.pkg release-assets/*.rpm)
          if (( ${#files[@]} == 0 )); then
            echo "No CookieMonster installers found." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_NAME"
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_NAME" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          echo "### [$RELEASE_NAME](${{ github.server_url }}/${{ github.repository }}/releases/tag/$RELEASE_TAG)" >> "$GITHUB_STEP_SUMMARY"
