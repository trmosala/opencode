name: cookiemonster-desktop

# Builds unsigned installers on manual dispatch. Signed macOS releases are built locally.
# Artifacts expire after 7 days; macOS uploads only the validated DMG.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Installer platform"
        required: true
        default: macos
        type: choice
        options:
          - macos
          - windows
      publish:
        description: "Publish installers after native validation"
        required: true
        default: false
        type: boolean
      revision:
        description: "Two-digit CookieMonster release revision"
        required: true
        default: "01"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: package (${{ inputs.platform || 'macos' }})
    # The vault helper uses experimental coroutines supported by the VS 2022 toolchain.
    runs-on: ${{ inputs.platform == 'windows' && 'windows-2022' || 'macos-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # CookieMonster is branded independently, so prod behavior is safe while CM_BRAND keeps its
      # identity, bundled CLI sidecar, and disabled upstream publishing.
      OPENCODE_CHANNEL: prod
      CM_BRAND: "1"
      CM_UNSIGNED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build renderer and main
        # Also runs scripts/prebuild.ts, which copies icons, builds the OpenCode node sidecar and the
        # cm-browser plugin bundle, then downloads the CLI into resources/.
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Test installer configuration and capabilities
        run: |
          bun test --timeout 20000 electron-builder.config.test.ts src/main/system-cli.test.ts
          if [[ "$RUNNER_OS" == macOS ]]; then
            bun test --timeout 20000 src/main/macos-user-install.test.ts
          fi
        working-directory: packages/desktop
        # The tests opt into each branding/signing variant themselves.
        env:
          CM_BRAND: "0"
          CM_UNSIGNED: "0"
          OPENCODE_CHANNEL: dev

      - name: Package installer
        env:
          PLATFORM: ${{ inputs.platform || 'macos' }}
          REVISION: ${{ inputs.revision }}
        run: |
          if [[ ! "$REVISION" =~ ^[0-9]{2}$ ]]; then exit 1; fi
          version=$(node -p "require('./package.json').version")
          export CM_VERSION="${version}-cm.$((10#$REVISION))"
          if [[ "$PLATFORM" == windows ]]; then
            npx electron-builder --win --x64 --publish never --config electron-builder.config.ts
          else
            npx electron-builder --mac --publish never --config electron-builder.config.ts
          fi
        working-directory: packages/desktop

      - name: List packaged output
        run: ls -la packages/desktop/dist

      - name: Test packaged Windows CLI
        if: inputs.platform == 'windows'
        run: |
          ./dist/win-unpacked/resources/opencode-cli.exe --version
          ./dist/win-unpacked/resources/cli/opencode.exe --version
          cmp dist/win-unpacked/resources/opencode-cli.exe dist/win-unpacked/resources/cli/opencode.exe
        working-directory: packages/desktop

      - name: Test non-root DMG app installation and removal
        if: inputs.platform != 'windows'
        # Validates copying and the private binary, not Electron startup or WPP authentication.
        run: bun scripts/smoke-macos-dmg.ts
        working-directory: packages/desktop

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cookiemonster-${{ inputs.platform || 'macos' }}
          path: |
            packages/desktop/dist/cookiemonster-mac-*.dmg
            packages/desktop/dist/cookiemonster-win-*.exe
            packages/desktop/dist/cookiemonster-win-*.exe.blockmap
            packages/desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: package
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve release
        id: release
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          if [[ ! "$REVISION" =~ ^[0-9]{2}$ ]]; then
            echo "Revision must contain exactly two digits." >&2
            exit 1
          fi
          version=$(node -p "require('./packages/desktop/package.json').version")
          tag="cookiemonster-v${version}_${REVISION}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=CookieMonster v${version}_${REVISION}" >> "$GITHUB_OUTPUT"

      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cookiemonster-*
          path: release-assets
          merge-multiple: true

      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ steps.release.outputs.name }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(release-assets/cookiemonster-mac-*.dmg release-assets/cookiemonster-win-*.exe release-assets/cookiemonster-win-*.exe.blockmap release-assets/latest.yml)
          if (( ${#files[@]} == 0 )); then
            echo "Expected CookieMonster installers." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_NAME"
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_NAME" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          echo "### [$RELEASE_NAME](${{ github.server_url }}/${{ github.repository }}/releases/tag/$RELEASE_TAG)" >> "$GITHUB_STEP_SUMMARY"
